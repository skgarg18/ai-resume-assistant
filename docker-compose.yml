services:
 redis:
   image: redis:7-alpine
   ports:
     - "6379:6379"
   healthcheck:
     test: ["CMD", "redis-cli", "ping"]
     interval: 5s
     retries: 5


 fastapi:
   build:
     context: ./backend
     dockerfile: Dockerfile
   image: resumeai-backend
 
   command: uvicorn main:app --host 0.0.0.0 --port 8000
 
   ports:
     - "8000:8000"

   env_file:
      - ./backend/.env
 
   environment:
     DATABASE_URL: postgresql://resume_user:resume_pass@<CLOUD_SQL_IP>:5432/resume_db
     REDIS_URL: redis://redis:6379
 
   depends_on:
     redis:
       condition: service_healthy
 
 
 worker:
   image: resumeai-backend
 
   command: rq worker-pool resume-queue --num-workers 2

   env_file:
      - ./backend/.env

   environment:
     DATABASE_URL: postgresql://resume_user:resume_pass@<CLOUD_SQL_IP>:5432/resume_db
     REDIS_URL: redis://redis:6379
 
   depends_on:
     redis:
       condition: service_healthy


 ui:
   build: ./frontend
   command: npm run start
   env_file:
    - ./frontend/.env.local
   ports:
     - "3000:3000"
   environment:
     NEXT_PUBLIC_API_URL: http://localhost:8000
   depends_on:
     - fastapi


 nginx:
   image: nginx:alpine
   ports:
     - "80:80"
   volumes:
     - ./nginx.conf:/etc/nginx/conf.d/default.conf
   depends_on:
     - fastapi
     - ui
